<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - POI System</title>
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">WEB ADMIN</div>
            <p class="subtitle">Đăng nhập vào hệ thống quản lý POI</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="username" required placeholder="Nhập tên đăng nhập...">
                </div>
                
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" required placeholder="Nhập mật khẩu...">
                </div>

                <div id="errorMsg" class="error-msg">Tên đăng nhập hoặc mật khẩu sai!</div>
                
                <button type="submit" class="btn-login">Đăng Nhập</button>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
