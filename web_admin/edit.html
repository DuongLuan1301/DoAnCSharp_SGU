<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit POI</title>
    <link rel="stylesheet" href="css/add.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">WEB ADMIN</div>
            <nav class="menu">
                <a href="index.html">📍 POIs List</a>
                <a href="stats.html">📊 Statistics</a>
                <a href="add.html">➕ Add POI</a>
                <a href="client.html">👥 Clients</a>
                <a href="#" class="logout" onclick="localStorage.removeItem('adminToken'); window.location.href='login.html';">🚪 Sign Out</a>
            </nav>
        </aside>

        <form id="poiForm" class="form-panel">
            <h2>Edit POI</h2>
            <div class="form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Latitude</label>
                        <input type="text" id="lat" required>
                    </div>
                    <div class="form-group">
                        <label>Longitude</label>
                        <input type="text" id="lng" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="desc" required></textarea>
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <label class="upload-box">
                        Click to choose a NEW image (Leave blank to keep old image)
                        <input type="file" id="fileInput" style="display: none;" accept="image/*">
                    </label>
                    <div class="file-info" id="fileName" style="color: blue; word-break: break-all;"></div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn cancel" onclick="window.location.href='index.html'">Cancel</button>
                    <button type="submit" class="btn submit">Update</button>
                </div>
            </div>
        </form>

        <div class="map-panel">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <script type="module" src="js/edit.js"></script>
</body>
</html>
