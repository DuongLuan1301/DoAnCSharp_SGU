<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add POI</title>

    <link rel="stylesheet" href="css/add.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">WEB ADMIN</div>

            <nav class="menu">
                <a href="index.html">📍 POIs List</a>
                <a href="add.html" class="active">➕ Add POI</a>
                <a class="logout">🚪 Sign Out</a>
            </nav>
        </aside>

        <!-- FORM -->
        <div class="form-panel">

            <h2>Add New POI</h2>

            <div class="form">
                <!-- NAME -->
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name">
                </div>
                <!-- ADDRESS -->
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address">
                </div>
                <!-- LOCATION -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Latitude</label>
                        <input type="text" id="lat">
                    </div>

                    <div class="form-group">
                        <label>Longitude</label>
                        <input type="text" id="lng">
                    </div>
                </div>
                <!-- DESCRIPTION -->
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="desc"></textarea>
                </div>
                <!-- IMAGE -->
                <div class="form-group">
                    <label>Image</label>

                    <label class="upload-box">
                        Click to choose image
                        <input type="file" id="fileInput" hidden>
                    </label>

                    <div class="file-info" id="fileName"></div>
                </div>

                <div class="form-actions">
                    <button class="btn cancel">Cancel</button>
                    <button type="button" class="btn submit">Save</button>
                </div>

            </div>
        </div>

        <!-- MAP -->
        <div class="map-panel">
            <div id="map"></div>
        </div>

    </div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- MAIN LOGIC -->
    <script src="js/add.js"></script>
</body>

</html>
